name: Entrega Contínua

on:
  workflow_call:

jobs:
  
  EC2:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Download a Build Artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
    # Artifact name
        name: programa

    - name: Deploy to Staging server
      uses: easingthemes/ssh-deploy@2cc5b27bf3029d0455dd5e09fe02633904031447 # v6.0.3 (antes: @main, uma branch que muda a qualquer momento)
      with:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
        REMOTE_USER: ${{ secrets.REMOTE_USER }}
        TARGET: /home/${{ secrets.REMOTE_USER }}
        EXCLUDE: "postgres-data"
        SCRIPT_BEFORE: |
          whoami
          ls -al
        SCRIPT_AFTER: |
          whoami
          ls -al
          echo $RSYNC_STDOUT

    - name: Execute remote SSH commands using password
      uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
      with:
        host: ${{ secrets.REMOTE_HOST }}
        username: ${{ secrets.REMOTE_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        debug: true
        script: |
          set -x
          whoami
          pwd
          ls -l main templates assets
          export HOST=${{ secrets.DBHOST }}
          export USER=${{ secrets.DBUSER }}
          export PASSWORD=${{ secrets.DBPASSWORD }}
          export DBNAME=${{ secrets.DBNAME }}
          export DBPORT=${{ secrets.DBPORT }}
          export PORT=8000
          export API_KEY_LEITURA=${{ secrets.API_KEY_LEITURA }}
          export API_KEY_ADMIN=${{ secrets.API_KEY_ADMIN }}
          echo "HOST=$HOST DBPORT=$DBPORT USER=$USER DBNAME=$DBNAME"
          chmod +x main
          nohup ./main > nohup.out 2> nohup.err < /dev/null &
          sleep 5                                                      
          echo "----- nohup.out -----"; tail -n 30 nohup.out           
          echo "----- nohup.err -----"; tail -n 30 nohup.err           
          pgrep -af '\./main' || echo "API NAO ESTA RODANDO"