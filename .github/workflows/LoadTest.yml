name: Load Test

on:
  workflow_call:

jobs:
  
  loadtest:
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - run: git clone https://github.com/EnzoDiasDev/infra-api-go-cicd-aws-ecs

    - name: HashiCorp - Setup Terraform
      uses: hashicorp/setup-terraform@v4

    - name: Terraform init
      run: terraform -chdir=infra-api-go-cicd-aws-ecs/env/Homolog init

    - name: Destroy infra
      run: terraform -chdir=infra-api-go-cicd-aws-ecs/env/Homolog destroy -auto-approve -var "imagem=enzodias31/go_ci3:${{ github.run_number }}"

    - name: Apply terraform
      run: terraform -chdir=infra-api-go-cicd-aws-ecs/env/Homolog apply -auto-approve -var "imagem=enzodias31/go_ci3:${{ github.run_number }}"
    
    - name: Output terraform
      run: echo "$(terraform -chdir=infra-api-go-cicd-aws-ecs/env/Homolog output -raw IP_alb)"
      id: URL

    - name: Setup python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13' 
    
    - name: Pip installer
      uses: BSFishy/pip-action@v1
      with:
        packages: |
          locust
    
    - run: |
        echo "from locust import HttpUser, TaskSet, task, between" >> locustfile.py
        echo "" >> locustfile.py
        echo "class UserTasks(TaskSet):" >> locustfile.py
        echo "  @task(1)" >> locustfile.py
        echo "  def index(self):" >> locustfile.py
        echo '    self.client.get("/bruno")' >> locustfile.py
        echo "" >> locustfile.py
        echo "class WebsiteUser(HttpUser)" >> locustfile.py
        echo "  tasks = [UserTasks]" >> locustfile.py
        echo "  wait_time = between(1, 5)" >> locustfile.py
    
    - name: Loadtest
      run: sleep 60s ; locust -f locustfile.py --haedless -u 10 -r 5 --run-time 60s -H http://${{ steps.URL.outputs.stdout }}

    - run: terraform -chdir=infra-api-go-cicd-aws-ecs/env/Homolog destroy -auto-approve -var "imagem=enzodias31/go_ci3:${{ github.run_number }}"